services:
  qoe-app:
    build: .
    ports:
      - "8000:8000"
    environment:
      QOE_DB_PATH: /data/qoe.db
    volumes:
      - qoe-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  qoe-data:
